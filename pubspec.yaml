name: petperdido
description: Aplicativo de busca e localização de pets perdidos.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Textos do Flutter (calendário, botões padrão) em português
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0

  # Mapa
  google_maps_flutter: ^2.5.3

  # Imagens (seleção de foto e cache de imagens da rede)
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # Localização (GPS, endereço <-> coordenadas, geohash para buscas por região)
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  dart_geohash: ^2.1.0
  # Requisições HTTP (busca de endereço no Nominatim/OpenStreetMap)
  http: ^1.6.0

  # Compartilhar post (menu nativo de compartilhamento)
  share_plus: ^13.3.1

  # Fonte Inter
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
